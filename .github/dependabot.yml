version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/ops, /ops/backup]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
