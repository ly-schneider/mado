name: Docker

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Release version without the v, e.g. 0.2.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: mado, context: ., file: ops/Dockerfile }
          - { name: mado-backup, context: ops/backup, file: ops/backup/Dockerfile }
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ !inputs.version }}
            type=sha,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=latest,enable=${{ !!inputs.version }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ inputs.version || 'main' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
