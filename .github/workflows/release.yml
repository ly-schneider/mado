name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: Plan version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.new_version }}
      changelog: ${{ steps.next.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Next version from the Conventional Commits since the last v* tag. Only calculates; the tag is
      # created when the approved release is published.
      - id: next
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ github.token }}
          dry_run: true
          default_bump: false
          custom_release_rules: perf:patch,refactor:patch,build:patch,revert:patch
      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.new_version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "Next release: **v$VERSION**. Approve the release job to publish it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release: only docs, chores, CI or tests changed since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  approve:
    name: Release v${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    # Waits for a reviewer. A newer merge replaces a release that is still waiting.
    environment: release
    concurrency:
      group: release-approval
      cancel-in-progress: true
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.changelog }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "mado $TAG" --notes "$NOTES"
          echo "id=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker
    needs: [plan, approve]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  desktop:
    name: macOS app
    needs: [plan, approve]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: Set app version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        working-directory: apps/desktop/src-tauri
        run: jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.tmp && mv tauri.conf.tmp tauri.conf.json
      # Unsigned until Apple signing secrets are added (see tauri-action docs).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target universal-apple-darwin
          releaseId: ${{ needs.approve.outputs.release_id }}

  publish:
    name: Publish release
    needs: [plan, docker, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publishing the draft creates the tag.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.plan.outputs.version }}" -R "$GITHUB_REPOSITORY" --draft=false --latest
