name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: Plan version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.new_version }}
      changelog: ${{ steps.next.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Next version from the Conventional Commits since the last v* tag. Only calculates; the tag is
      # created when the approved release is published.
      - id: next
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ github.token }}
          dry_run: true
          default_bump: false
          custom_release_rules: perf:patch,refactor:patch,build:patch,revert:patch
      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.new_version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "Next release: **v$VERSION**. Approve the release job to publish it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release: only docs, chores, CI or tests changed since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  approve:
    name: Release v${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    # Waits for a reviewer. A newer merge replaces a release that is still waiting.
    environment: release
    concurrency:
      group: release-approval
      cancel-in-progress: true
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.changelog }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "mado $TAG" --notes "$NOTES"
          echo "id=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker
    needs: [plan, approve]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  desktop:
    name: macOS app
    needs: [plan, approve]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      # Fail before the long build rather than publishing an unsigned app or one that can't update.
      - name: Check signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8 TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see apps/desktop/RELEASING.md)"
            exit 1
          fi
      # notarytool reads the App Store Connect key from a file.
      - name: Write notarization key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$path"
          echo "APPLE_API_KEY_PATH=$path" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      # Updater artifacts only in CI, so local builds don't need the updater key.
      - name: Set app version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        working-directory: apps/desktop/src-tauri
        run: jq --arg v "$VERSION" '.version = $v | .bundle.createUpdaterArtifacts = true' tauri.conf.json > tauri.conf.tmp && mv tauri.conf.tmp tauri.conf.json
      # Signs with the Developer ID certificate, notarizes and staples, then uploads the app, the DMG,
      # the signed updater archive and latest.json, which installed apps poll for updates.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target universal-apple-darwin
          releaseId: ${{ needs.approve.outputs.release_id }}
      - name: Verify signature and notarization
        working-directory: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          codesign --verify --deep --strict --verbose=2 macos/mado.app
          xcrun stapler validate macos/mado.app
          spctl --assess --type execute --verbose=2 macos/mado.app
          ls macos/*.app.tar.gz macos/*.app.tar.gz.sig

  publish:
    name: Publish release
    needs: [plan, docker, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publishing the draft creates the tag.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.plan.outputs.version }}" -R "$GITHUB_REPOSITORY" --draft=false --latest
