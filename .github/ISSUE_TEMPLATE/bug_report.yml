name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Web, macOS app, iPhone PWA, MCP / agent, API, Not sure]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
