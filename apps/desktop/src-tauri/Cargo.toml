[package]
name = "mado"
version = "0.1.0"
description = "mado desktop"
authors = ["Leys Services"]
edition = "2021"

[lib]
name = "mado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Stripped proc-macro dylibs fail to load on macOS 27 ("mis-aligned LINKEDIT string pool"),
# so only the shipped binary is stripped.
[profile.release.build-override]
strip = false
