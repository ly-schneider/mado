services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: mado_owner
      POSTGRES_PASSWORD: mado
      POSTGRES_DB: mado
    ports: ["5442:5432"]
    volumes: [mado-dev-pg18:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mado_owner -d mado"]
      interval: 2s
      retries: 20
volumes:
  mado-dev-pg18:
